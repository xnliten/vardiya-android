<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takvim Dişli (Rotary) Tasarım Örnekleri</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', sans-serif;
      background: #0b0f19;
      color: #fff;
    }
    
    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 40px;
      color: #0ea5e9;
    }

    .concept-wrapper {
      margin-bottom: 60px;
    }

    .concept-title {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 10px;
      padding-left: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Base Rotary Container */
    .rotary-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      height: 120px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none; /* Firefox */
      background: rgba(255,255,255,0.02);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.05);
      /* Perspective for 3D effects */
      perspective: 1000px;
    }
    .rotary-container::-webkit-scrollbar { display: none; }

    .spacer {
      flex: 0 0 calc(50vw - 35px); /* Half viewport minus half item width */
    }

    .day-item {
      flex: 0 0 70px;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      scroll-snap-align: center;
      user-select: none;
      /* Base styles, overridden by specific concepts */
      transform-origin: center center;
    }
    
    .day-name { font-size: 12px; font-weight: 600; text-transform: uppercase; opacity: 0.7; }
    .day-num { font-size: 28px; font-weight: 800; }

    /* =========================================
       CONCEPT 1: Gerçekçi 3D Silindir (iOS Tarzı)
       ========================================= */
    #concept1 .day-item {
      background: transparent;
    }

    /* =========================================
       CONCEPT 2: Neon Dişli Çark (Cyberpunk)
       ========================================= */
    #concept2 .rotary-container {
      background: #000;
      border-color: #333;
    }
    #concept2 .day-item {
      border: 2px solid #222;
      border-radius: 12px;
      margin: 0 5px;
      background: #111;
      transition: box-shadow 0.1s, border-color 0.1s;
    }

    /* =========================================
       CONCEPT 3: Minimalist Cam (Glassmorphism)
       ========================================= */
    #concept3 .rotary-container {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      backdrop-filter: blur(10px);
    }
    #concept3 .day-item {
      background: rgba(255,255,255,0.03);
      border-radius: 50%;
      height: 70px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* =========================================
       CONCEPT 4: Büyüteç Efekti (Merkez Odaklı)
       ========================================= */
    #concept4 { position: relative; }
    #concept4 .magnifier {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 76px; height: 86px;
      border: 2px solid #0ea5e9;
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
      background: rgba(14, 165, 233, 0.05);
      z-index: 10;
    }

    /* =========================================
       CONCEPT 5: Oyun Kartları (Poker)
       ========================================= */
    #concept5 .day-item {
      background: #fff;
      color: #0b0f19;
      border-radius: 8px;
      margin: 0 -10px; /* Overlapping */
      box-shadow: -5px 0 15px rgba(0,0,0,0.5);
    }

    /* =========================================
       CONCEPT 6: Dijital Cetvel (Ruler)
       ========================================= */
    #concept6 .day-item {
      border-left: 2px solid rgba(255,255,255,0.2);
      border-radius: 0;
      justify-content: flex-end;
      padding-bottom: 10px;
    }
    
    /* =========================================
       CONCEPT 7: Kapsül (Pill)
       ========================================= */
    #concept7 .day-item {
      border-radius: 40px;
      background: #1e293b;
      margin: 0 5px;
    }

    /* =========================================
       CONCEPT 8: Tam 3D Karusel
       ========================================= */
    #concept8 .rotary-container { perspective: 400px; }
    #concept8 .day-item { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; border-radius: 12px; }

    /* =========================================
       CONCEPT 9: Keskin Bloklar (Makine Dişlisi)
       ========================================= */
    #concept9 .day-item {
      border-radius: 0;
      background: #334155;
      margin: 0 2px;
      border-bottom: 4px solid #0f172a;
    }

    /* =========================================
       CONCEPT 10: Sadece Rakamlar (Temiz)
       ========================================= */
    #concept10 .day-item { background: transparent; }
    #concept10 .day-name { display: none; }
    #concept10 .day-num { font-size: 40px; }

    /* =========================================
       CONCEPT 11: Kurumsal Klasik (Hafif Gölge & Çerçeve)
       ========================================= */
    #concept11 .rotary-container { background: #f8fafc; color: #334155; border-color: #e2e8f0; }
    #concept11 .day-item { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; margin: 0 4px; color: #64748b; }
    
    /* =========================================
       CONCEPT 12: Kurumsal Altı Çizgili (Sekme Tarzı)
       ========================================= */
    #concept12 .rotary-container { background: #fff; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; border-radius: 0; color: #334155; }
    #concept12 .day-item { border-radius: 0; border-bottom: 3px solid transparent; background: transparent; color: #64748b; }

    /* =========================================
       CONCEPT 13: Kurumsal Panel (Sol Çizgili)
       ========================================= */
    #concept13 .rotary-container { background: #f1f5f9; color: #334155; }
    #concept13 .day-item { background: #e2e8f0; border-radius: 6px; margin: 0 4px; color: #64748b; border-left: 4px solid transparent; }

    /* =========================================
       CONCEPT 14: Kurumsal Solid (Koyu Mavi Vurgu)
       ========================================= */
    #concept14 .rotary-container { background: #ffffff; color: #1e293b; border: 1px solid #cbd5e1; }
    #concept14 .day-item { background: transparent; border-radius: 8px; color: #64748b; transition: all 0.2s; }

    /* =========================================
       CONCEPT 15: Kurumsal Yükselti (Material Elevation)
       ========================================= */
    #concept15 .rotary-container { background: #f8fafc; color: #475569; }
    #concept15 .day-item { background: transparent; border-radius: 12px; color: #94a3b8; transition: box-shadow 0.2s, background 0.2s; }

    /* =========================================
       CONCEPT 16: Koyu Kurumsal Klasik
       ========================================= */
    #concept16 .rotary-container { background: #0f172a; border-color: #1e293b; color: #94a3b8; }
    #concept16 .day-item { background: #1e293b; border: 1px solid #334155; border-radius: 8px; margin: 0 4px; color: #64748b; }

    /* =========================================
       CONCEPT 17: Koyu Kurumsal Oval (Dashboard)
       ========================================= */
    #concept17 .rotary-container { background: #0b0f19; border: none; border-radius: 20px; }
    #concept17 .day-item { background: transparent; border-radius: 30px; margin: 0 2px; color: #475569; }

    /* =========================================
       CONCEPT 18: Koyu Kurumsal Çizgi (Üst Vurgu)
       ========================================= */
    #concept18 .rotary-container { background: #111827; border-top: 1px solid #1f2937; border-bottom: 1px solid #1f2937; border-radius: 0; }
    #concept18 .day-item { border-radius: 0; border-top: 3px solid transparent; background: transparent; color: #4b5563; }

    /* =========================================
       CONCEPT 19: Koyu Kurumsal Ambiyans
       ========================================= */
    #concept19 .rotary-container { background: #171717; border-color: #262626; }
    #concept19 .day-item { background: transparent; border-radius: 10px; color: #525252; transition: all 0.3s ease; }

    /* =========================================
       CONCEPT 20: Koyu Kurumsal Keskin Kenar
       ========================================= */
    #concept20 .rotary-container { background: #09090b; border: 1px solid #27272a; border-radius: 4px; }
    #concept20 .day-item { background: #18181b; border-radius: 4px; margin: 0 3px; color: #525252; border-left: 3px solid #27272a; }

  </style>
</head>
<body>

  <h1>10 Farklı Dişli Takvim Konsepti</h1>
  <p style="text-align: center; color: #94a3b8; font-size: 14px; margin-top:-30px; margin-bottom: 40px;">
    Sağa veya sola kaydırarak dişli hissiyatını test edin.<br>Hangisini beğenirseniz bana numarasını söyleyin.
  </p>

  <div id="app"></div>

  <script>
    const days = [
      { name: 'Pzt', num: 1 }, { name: 'Sal', num: 2 }, { name: 'Çar', num: 3 },
      { name: 'Per', num: 4 }, { name: 'Cum', num: 5 }, { name: 'Cmt', num: 6 },
      { name: 'Paz', num: 7 }, { name: 'Pzt', num: 8 }, { name: 'Sal', num: 9 },
      { name: 'Çar', num: 10 }, { name: 'Per', num: 11 }, { name: 'Cum', num: 12 },
      { name: 'Cmt', num: 13 }, { name: 'Paz', num: 14 }, { name: 'Pzt', num: 15 },
      { name: 'Sal', num: 16 }, { name: 'Çar', num: 17 }, { name: 'Per', num: 18 },
      { name: 'Cum', num: 19 }, { name: 'Cmt', num: 20 }, { name: 'Paz', num: 21 },
      { name: 'Pzt', num: 22 }, { name: 'Sal', num: 23 }, { name: 'Çar', num: 24 },
      { name: 'Per', num: 25 }, { name: 'Cum', num: 26 }, { name: 'Cmt', num: 27 },
      { name: 'Paz', num: 28 }, { name: 'Pzt', num: 29 }, { name: 'Sal', num: 30 }
    ];

    const concepts = [
      { id: 'concept1', title: '1. Gerçekçi 3D Silindir (iOS Hissiyatı)' },
      { id: 'concept2', title: '2. Neon Dişli Çark (Cyberpunk)' },
      { id: 'concept3', title: '3. Minimalist Cam (Yuvarlak)' },
      { id: 'concept4', title: '4. Merkez Odaklı (Sabit Büyüteç Çerçevesi)' },
      { id: 'concept5', title: '5. Oyun Kartları (Örtüşen)' },
      { id: 'concept6', title: '6. Dijital Cetvel (Minimal Çizgiler)' },
      { id: 'concept7', title: '7. Kapsül (Yatay Genişleyen)' },
      { id: 'concept8', title: '8. Tam 3D Karusel (Derinlikli)' },
      { id: 'concept9', title: '9. Makine Dişlisi (Keskin Bloklar)' },
      { id: 'concept10', title: '10. Sadece Rakamlar (Çok Temiz)' },
      { id: 'concept11', title: '11. Kurumsal Klasik (Hafif Gölge & Çerçeve)' },
      { id: 'concept12', title: '12. Kurumsal Alt Çizgili (Sekme Tarzı)' },
      { id: 'concept13', title: '13. Kurumsal Panel (Belirgin Sol Çizgi)' },
      { id: 'concept14', title: '14. Kurumsal Solid (Mavi Vurgu)' },
      { id: 'concept15', title: '15. Kurumsal Yükselti (Material Design)' },
      { id: 'concept16', title: '16. Koyu Kurumsal Klasik (Şık & Okunaklı)' },
      { id: 'concept17', title: '17. Koyu Kurumsal Oval (Modern Dashboard)' },
      { id: 'concept18', title: '18. Koyu Kurumsal Çizgi (Üst Vurgu)' },
      { id: 'concept19', title: '19. Koyu Kurumsal Ambiyans (Hafif Işıltı)' },
      { id: 'concept20', title: '20. Koyu Kurumsal Keskin Kenar (Profesyonel)' }
    ];

    const app = document.getElementById('app');

    concepts.forEach(concept => {
      const wrapper = document.createElement('div');
      wrapper.className = 'concept-wrapper';
      wrapper.id = concept.id;
      
      let extraHtml = '';
      if(concept.id === 'concept4') extraHtml = '<div class="magnifier"></div>';

      let itemsHtml = days.map(d => `
        <div class="day-item">
          <div class="day-name">${d.name}</div>
          <div class="day-num">${d.num}</div>
        </div>
      `).join('');

      wrapper.innerHTML = `
        <div class="concept-title">${concept.title}</div>
        ${extraHtml}
        <div class="rotary-container" id="${concept.id}-container">
          <div class="spacer"></div>
          ${itemsHtml}
          <div class="spacer"></div>
        </div>
      `;
      app.appendChild(wrapper);
    });

    // Animate logic
    function setupRotaryAnimation() {
      const containers = document.querySelectorAll('.rotary-container');
      
      containers.forEach(container => {
        const items = container.querySelectorAll('.day-item');
        const conceptId = container.parentElement.id;

        const updateStyles = () => {
          const containerCenter = container.scrollLeft + (container.clientWidth / 2);
          
          items.forEach(item => {
            const itemCenter = item.offsetLeft + (item.clientWidth / 2);
            // Distance from center (-1 to 1 basically within visible range)
            const diff = itemCenter - containerCenter;
            const maxDist = container.clientWidth / 1.5;
            let ratio = diff / maxDist; // 0 at center, 1 at right edge, -1 at left edge
            if (ratio > 1) ratio = 1;
            if (ratio < -1) ratio = -1;

            const absRatio = Math.abs(ratio);
            
            let scale, opacity, rotateY, rotateX, rotateZ, translateX, translateY, translateZ;
            let bgColor = '', borderColor = '', boxShadow = '';

            // Apply different math based on concept
            switch(conceptId) {
              case 'concept1': // 3D Cylinder
                rotateY = ratio * 60; // tilt up to 60deg
                scale = 1 - (absRatio * 0.4);
                opacity = 1 - (absRatio * 0.8);
                translateZ = -(absRatio * 100);
                item.style.transform = `translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
                item.style.opacity = opacity;
                if(absRatio < 0.1) item.style.color = '#0ea5e9'; else item.style.color = '#fff';
                break;
                
              case 'concept2': // Neon Gear
                scale = 1 - (absRatio * 0.2);
                opacity = 1 - (absRatio * 0.5);
                rotateX = ratio * 20; 
                if(absRatio < 0.15) {
                  borderColor = '#0ea5e9';
                  boxShadow = '0 0 15px rgba(14, 165, 233, 0.6)';
                  scale = 1.1;
                }
                item.style.transform = `rotateX(${rotateX}deg) scale(${scale})`;
                item.style.opacity = opacity;
                item.style.borderColor = borderColor;
                item.style.boxShadow = boxShadow;
                break;

              case 'concept3': // Glass
                scale = 1 - (absRatio * 0.5);
                opacity = 1 - (absRatio * 0.7);
                if(absRatio < 0.15) {
                  item.style.background = 'rgba(255,255,255,0.15)';
                  item.style.borderColor = 'rgba(255,255,255,0.4)';
                  scale = 1.2;
                } else {
                  item.style.background = 'rgba(255,255,255,0.03)';
                  item.style.borderColor = 'rgba(255,255,255,0.1)';
                }
                item.style.transform = `scale(${scale})`;
                item.style.opacity = opacity;
                break;

              case 'concept4': // Magnifier (Flat but center gets big)
                scale = absRatio < 0.2 ? 1.2 : 0.8;
                opacity = absRatio < 0.2 ? 1 : 0.4;
                item.style.transform = `scale(${scale})`;
                item.style.opacity = opacity;
                if(absRatio < 0.2) item.style.color = '#0ea5e9'; else item.style.color = '#fff';
                break;

              case 'concept5': // Cards
                rotateZ = ratio * 15; // fan out
                translateY = absRatio * 20; // drop down
                scale = 1 - (absRatio * 0.2);
                item.style.transform = `translateY(${translateY}px) rotateZ(${rotateZ}deg) scale(${scale})`;
                item.style.zIndex = 100 - Math.round(absRatio * 100);
                if(absRatio < 0.1) {
                  item.style.color = '#ef4444'; 
                  item.style.transform += ' translateY(-10px)';
                } else {
                  item.style.color = '#0b0f19';
                }
                break;

              case 'concept6': // Ruler
                scale = 1;
                opacity = 1 - (absRatio * 0.6);
                translateY = absRatio * 15;
                item.style.transform = `translateY(${translateY}px)`;
                item.style.opacity = opacity;
                if(absRatio < 0.1) {
                  item.style.borderLeftColor = '#0ea5e9';
                  item.style.color = '#0ea5e9';
                } else {
                  item.style.borderLeftColor = 'rgba(255,255,255,0.2)';
                  item.style.color = '#fff';
                }
                break;

              case 'concept7': // Pill
                scale = 1 - (absRatio * 0.3);
                opacity = 1 - (absRatio * 0.5);
                if(absRatio < 0.15) {
                  item.style.background = '#0ea5e9';
                  item.style.transform = `scale(${scale}) scaleX(1.3)`; // stretch width
                } else {
                  item.style.background = '#1e293b';
                  item.style.transform = `scale(${scale})`;
                }
                item.style.opacity = opacity;
                break;

              case 'concept8': // 3D Carousel Deep
                rotateY = ratio * 75; 
                scale = 1;
                translateZ = -(absRatio * 200);
                opacity = 1 - (absRatio * 0.9);
                item.style.transform = `translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
                item.style.opacity = opacity;
                if(absRatio < 0.1) item.style.background = 'rgba(16, 185, 129, 0.4)';
                else item.style.background = 'rgba(16, 185, 129, 0.1)';
                break;

              case 'concept9': // Machine Gear
                scale = 1 - (absRatio * 0.1);
                translateY = absRatio * 10;
                item.style.transform = `scale(${scale}) translateY(${translateY}px)`;
                if(absRatio < 0.1) {
                  item.style.background = '#0ea5e9';
                  item.style.borderBottomColor = '#0284c7';
                } else {
                  item.style.background = '#334155';
                  item.style.borderBottomColor = '#0f172a';
                }
                break;

              case 'concept10': // Numbers only
                rotateY = ratio * 45;
                scale = 1 - (absRatio * 0.6);
                opacity = 1 - (absRatio * 0.85);
                item.style.transform = `rotateY(${rotateY}deg) scale(${scale})`;
                item.style.opacity = opacity;
                if(absRatio < 0.1) item.style.color = '#f59e0b'; else item.style.color = '#fff';
                break;

              case 'concept11': // Corporate Classic
                scale = 1;
                if(absRatio < 0.1) {
                  item.style.borderColor = '#0284c7';
                  item.style.color = '#0f172a';
                  item.style.boxShadow = '0 4px 12px rgba(0,0,0,0.1)';
                  item.style.transform = `scale(1.1)`;
                } else {
                  item.style.borderColor = '#e2e8f0';
                  item.style.color = '#94a3b8';
                  item.style.boxShadow = 'none';
                  item.style.transform = `scale(1)`;
                }
                break;

              case 'concept12': // Corporate Underline
                scale = 1;
                opacity = 1 - (absRatio * 0.5);
                item.style.opacity = opacity;
                if(absRatio < 0.1) {
                  item.style.borderBottomColor = '#2563eb';
                  item.style.color = '#1e293b';
                  item.style.transform = `scale(1.1)`;
                } else {
                  item.style.borderBottomColor = 'transparent';
                  item.style.color = '#94a3b8';
                  item.style.transform = `scale(0.9)`;
                }
                break;

              case 'concept13': // Corporate Panel
                scale = 1;
                if(absRatio < 0.1) {
                  item.style.background = '#ffffff';
                  item.style.borderLeftColor = '#2563eb';
                  item.style.color = '#0f172a';
                  item.style.boxShadow = '2px 2px 8px rgba(0,0,0,0.05)';
                  item.style.transform = `scale(1.05)`;
                } else {
                  item.style.background = '#e2e8f0';
                  item.style.borderLeftColor = 'transparent';
                  item.style.color = '#64748b';
                  item.style.boxShadow = 'none';
                  item.style.transform = `scale(0.95)`;
                }
                break;

              case 'concept14': // Corporate Solid
                scale = 1 - (absRatio * 0.2);
                item.style.transform = `scale(${scale})`;
                if(absRatio < 0.1) {
                  item.style.background = '#0ea5e9';
                  item.style.color = '#ffffff';
                } else {
                  item.style.background = 'transparent';
                  item.style.color = '#94a3b8';
                }
                break;

              case 'concept15': // Corporate Elevation
                scale = 1;
                opacity = 1 - (absRatio * 0.4);
                item.style.opacity = opacity;
                if(absRatio < 0.1) {
                  item.style.background = '#ffffff';
                  item.style.color = '#0f172a';
                  item.style.boxShadow = '0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1)';
                  item.style.transform = `scale(1.15) translateY(-5px)`;
                } else {
                  item.style.background = 'transparent';
                  item.style.color = '#94a3b8';
                  item.style.boxShadow = 'none';
                  item.style.transform = `scale(0.9) translateY(0)`;
                }
                break;

              case 'concept16': // Dark Corporate Classic
                scale = 1;
                if(absRatio < 0.1) {
                  item.style.borderColor = '#3b82f6';
                  item.style.background = '#1e293b';
                  item.style.color = '#f8fafc';
                  item.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
                  item.style.transform = `scale(1.1)`;
                } else {
                  item.style.borderColor = '#334155';
                  item.style.background = '#0f172a';
                  item.style.color = '#64748b';
                  item.style.boxShadow = 'none';
                  item.style.transform = `scale(0.95)`;
                }
                break;

              case 'concept17': // Dark Corporate Dash
                scale = 1 - (absRatio * 0.15);
                item.style.transform = `scale(${scale})`;
                if(absRatio < 0.1) {
                  item.style.background = '#2563eb';
                  item.style.color = '#ffffff';
                  item.style.boxShadow = '0 4px 15px rgba(37, 99, 235, 0.4)';
                } else {
                  item.style.background = 'transparent';
                  item.style.color = '#475569';
                  item.style.boxShadow = 'none';
                }
                break;

              case 'concept18': // Dark Corporate Line
                scale = 1;
                opacity = 1 - (absRatio * 0.5);
                item.style.opacity = opacity;
                if(absRatio < 0.1) {
                  item.style.borderTopColor = '#38bdf8';
                  item.style.color = '#f1f5f9';
                  item.style.transform = `scale(1.1) translateY(2px)`;
                } else {
                  item.style.borderTopColor = 'transparent';
                  item.style.color = '#4b5563';
                  item.style.transform = `scale(0.9) translateY(0)`;
                }
                break;

              case 'concept19': // Dark Corporate Glow
                scale = 1 - (absRatio * 0.2);
                item.style.transform = `scale(${scale})`;
                if(absRatio < 0.1) {
                  item.style.background = '#262626';
                  item.style.color = '#e5e5e5';
                  item.style.boxShadow = '0 0 25px rgba(56, 189, 248, 0.15)';
                  item.style.border = '1px solid #404040';
                } else {
                  item.style.background = 'transparent';
                  item.style.color = '#525252';
                  item.style.boxShadow = 'none';
                  item.style.border = '1px solid transparent';
                }
                break;

              case 'concept20': // Dark Corporate Edge
                scale = 1;
                if(absRatio < 0.1) {
                  item.style.background = '#27272a';
                  item.style.borderLeftColor = '#0ea5e9';
                  item.style.color = '#f4f4f5';
                  item.style.transform = `scale(1.05)`;
                } else {
                  item.style.background = '#18181b';
                  item.style.borderLeftColor = '#27272a';
                  item.style.color = '#525252';
                  item.style.transform = `scale(0.95)`;
                }
                break;
            }
          });
        };

        // Run on scroll and init
        container.addEventListener('scroll', updateStyles);
        updateStyles();
        
        // Scroll to initial center (day 15)
        setTimeout(() => {
          const target = items[14];
          const containerCenter = container.clientWidth / 2;
          const dayCenter = target.offsetLeft + (target.clientWidth / 2);
          container.scrollTo({ left: dayCenter - containerCenter });
        }, 100);
      });
    }

    // Initialize
    setupRotaryAnimation();
  </script>
</body>
</html>
